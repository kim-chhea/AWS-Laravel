services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alizo
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: alizo_web
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: alizo_db
    environment:
      MYSQL_ROOT_PASSWORD: 8120@@
      MYSQL_DATABASE: Laws
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

