
name: CI/CD for Laravel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, iconv, json, mbstring, pdo

      - name: Copy .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate --ansi

      - name: Show generated key
        run: grep APP_KEY .env

      - name: Directory Permissions
        run: chmod -R 755 storage bootstrap/cache

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        timeout-minutes: 12
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd ${{ secrets.APP_PATH }}
            echo "=== Pulling latest code ==="
            git fetch origin
            git reset --hard origin/main
            echo "=== Stopping containers ==="
            docker compose down
            echo "=== Building containers ==="
            docker compose build --no-cache
            echo "=== Starting containers ==="
            docker compose up -d
            echo "=== Waiting for containers ==="
            sleep 15
            echo "=== Running composer install ==="
            docker compose exec -T app bash -c "cd /var/www && composer install --no-dev --optimize-autoloader --no-interaction" || true
            echo "=== Setting up Laravel ==="
            docker compose exec -T app bash -c "cd /var/www && [ ! -f .env ] && cp .env.example .env || true" || true
            docker compose exec -T app bash -c "cd /var/www && php artisan key:generate --force --no-interaction" || true
            docker compose exec -T app bash -c "cd /var/www && php artisan optimize:clear" || true
            echo "=== Setting permissions ==="
            docker compose exec -T app chmod -R 775 /var/www/storage /var/www/bootstrap/cache || true
            echo "=== Container Status ==="
            docker compose ps
            echo "=== Deployment complete ==="
