
name: CI/CD for Laravel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, iconv, json, mbstring, pdo

      - name: Copy .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate --ansi

      - name: Show generated key
        run: grep APP_KEY .env

      - name: Directory Permissions
        run: chmod -R 755 storage bootstrap/cache

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 8

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Starting deployment ==="
            cd ${{ secrets.APP_PATH }}
            echo "=== Resetting git ==="
            sudo chown -R $USER:$USER . || true
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            echo "=== Stopping containers ==="
            docker compose down || true
            docker system prune -f || true
            echo "=== Building containers ==="
            timeout 240 docker compose build --no-cache || (echo "Build failed" && exit 1)
            echo "=== Starting containers ==="
            timeout 60 docker compose up -d || (echo "Start failed" && exit 1)
            echo "=== Waiting for services ==="
            sleep 15
            echo "=== Checking container health ==="
            docker compose ps
            if docker compose exec -T app echo "PHP container is running" 2>/dev/null; then
              echo "✅ PHP container is healthy"
            else
              echo "❌ PHP container is not responding"
              exit 1
            fi
            echo "=== Deployment successful ==="
